<!DOCTYPE html>
<html lang="es"><head><meta charset="utf-8"><title>NÜVO STORE</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<link href="https://fonts.googleapis.com/css2?family=Jost:wght@400;600&family=Marcellus&display=swap" rel="stylesheet">
<style>
:root{--bg:#f4ede1;--card:#fbf7f0;--ink:#151515;--mut:#6b6459;--ac:#151515;--acx:#f4ede1;--ln:#dcd2c0;--ok:#0a8f5b;--bad:#c62828;color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#141311;--card:#1e1c19;--ink:#f4ede1;--mut:#a39b8d;--ac:#f4ede1;--acx:#151515;--ln:#34312b;--ok:#3ddc97;--bad:#ff7b7b;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#141311;--card:#1e1c19;--ink:#f4ede1;--mut:#a39b8d;--ac:#f4ede1;--acx:#151515;--ln:#34312b;--ok:#3ddc97;--bad:#ff7b7b;color-scheme:dark}
*{box-sizing:border-box}html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--ink);font:400 15px/1.5 Jost,system-ui,sans-serif}
button,input,textarea{font:inherit;color:inherit}
button{cursor:pointer;border:0;border-radius:10px;padding:9px 14px;background:var(--ac);color:var(--acx);font-weight:600}
button.g{background:transparent;color:var(--ink);border:1px solid var(--ln)}button.r{background:var(--bad);color:#fff}
button:disabled{opacity:.45;cursor:not-allowed}button:focus-visible,input:focus-visible,textarea:focus-visible{outline:2px solid var(--ac);outline-offset:2px}
input,textarea{width:100%;padding:9px 11px;border:1px solid var(--ln);border-radius:10px;background:var(--card);margin:3px 0 10px}
header{display:flex;justify-content:space-between;align-items:center;padding:14px 5vw;background:var(--card);border-bottom:1px solid var(--ln);position:sticky;top:0;z-index:5}
.logo{display:flex;align-items:center;gap:10px;font:400 22px Marcellus,Georgia,serif;letter-spacing:.14em;color:var(--ink);text-decoration:none}.logo img{width:48px;height:48px;border-radius:50%}.fl{width:110px;height:110px;border-radius:50%;display:block;margin:0 auto 10px}h1,h2,h3{font-family:Marcellus,Georgia,serif;font-weight:400}
main{max-width:1100px;margin:0 auto;padding:18px 5vw 90px}
.ban{position:relative;border-radius:18px;overflow:hidden;min-height:210px;display:flex;align-items:flex-end;color:#fff;background-size:cover;background-position:center}
.ban div{padding:26px;background:linear-gradient(transparent,rgba(0,0,0,.55));width:100%}
.ban h1{margin:0;font-size:clamp(24px,5vw,40px);font-weight:400;line-height:1.1}.ban p{margin:6px 0 0}
.dots{display:flex;gap:6px;justify-content:center;margin:10px 0}.dots i{width:8px;height:8px;border-radius:9px;background:var(--ln);cursor:pointer}.dots i.on{background:var(--ac);width:22px}
.bar{display:flex;gap:8px;flex-wrap:wrap;margin:8px 0 14px}.bar input{max-width:260px;margin:0}
.chip{background:var(--card);color:var(--ink);border:1px solid var(--ln)}.chip.on{background:var(--ink);color:var(--bg)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:14px}
.card{background:var(--card);border:1px solid var(--ln);border-radius:14px;overflow:hidden;display:flex;flex-direction:column}
.im{aspect-ratio:1;display:grid;place-items:center;font-size:48px;font-weight:800;color:#fff;background:linear-gradient(135deg,#2a2622,#6b5d4a);background-size:cover;background-position:center;position:relative;cursor:pointer}
.im em{position:absolute;right:8px;bottom:8px;font:600 11px Jost;background:rgba(0,0,0,.55);padding:2px 8px;border-radius:9px}
.tag{position:absolute;left:8px;top:8px;font:600 11px Jost;padding:3px 9px;border-radius:9px;background:var(--bad);color:#fff}
.cb{padding:12px;display:flex;flex-direction:column;gap:4px;flex:1}.cb h3{margin:0;font-size:15px}.cb small{color:var(--mut)}
.pr{font-weight:800;font-size:18px}.pr s{font-weight:400;color:var(--mut);font-size:13px;margin-left:6px}
.row{display:flex;gap:6px;margin-top:auto;padding-top:8px}.row button{flex:1;padding:8px 6px;font-size:13px}
.mb{position:fixed;inset:0;background:rgba(0,0,0,.55);display:flex;justify-content:flex-end;z-index:20}
.mc{background:var(--bg);width:min(560px,100%);height:100%;overflow:auto;padding:20px calc(18px) calc(20px + env(safe-area-inset-bottom,0px))}
.mc h2{margin:0 0 12px}.li{display:flex;gap:10px;align-items:center;justify-content:space-between;padding:10px 0;border-bottom:1px solid var(--ln)}
.tabs{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:14px}.box{background:var(--card);border:1px solid var(--ln);border-radius:12px;padding:12px;margin-bottom:10px}
.wa{position:fixed;right:16px;bottom:calc(16px + env(safe-area-inset-bottom,0px));background:#1faa59;color:#fff;border-radius:99px;padding:13px 18px;text-decoration:none;font-weight:600;z-index:6}
footer{text-align:center;color:var(--mut);padding:20px 5vw 80px;font-size:13px}footer button{background:none;color:var(--mut);text-decoration:underline;padding:4px 8px}
.tot{font-size:18px;font-weight:800}.mut{color:var(--mut)}.ok{color:var(--ok)}
</style></head><body>

function qty(id,d){const c=cart.find(x=>x.id==id),p=S.products.find(x=>x.id==id);c.q=Math.min(p.s,c.q+d);if(c.q<=0)cart=cart.filter(x=>x!=c);sv();rp();cartV()}
function cup(){const k=$('#cp').value.trim().toUpperCase();coupon=S.coupons.find(c=>c.k.toUpperCase()==k)||null;cartV(coupon?'':'Cupón no válido')}
function order(){const t=tot();let m='Hola, quiero hacer este pedido en NÜVO STORE:\n';cart.forEach(c=>{const p=S.products.find(x=>x.id==c.id);m+='• '+c.q+' × '+p.n+' — '+money(pr(p)*c.q)+'\n'});if(coupon)m+='Cupón: '+coupon.k+' (−'+money(t.d)+')\n';m+='Total: '+money(t.t)+' (envío a cotizar)';window.open(wa(m),'_blank')}
const doc=k=>M('<h2>'+(k=='priv'?'Aviso de privacidad':'Envíos y devoluciones')+'</h2><p>'+esc(S.cfg[k])+'</p><button class="g" onclick="X()">Cerrar</button>');
/* ADMIN (local de prueba: se reemplazará por Firebase Auth) */
const fbV=()=>M('<h2>Administrador</h2><input id="em" type="email" placeholder="Correo"><input id="pw" type="password" placeholder="Contraseña"><button onclick="fbin()">Entrar</button> <button class="g" onclick="X()">Cancelar</button><p class="mut" id="pe"></p>');
const fbin=()=>auth.signInWithEmailAndPassword($('#em').value.trim(),$('#pw').value).then(()=>{admin=true;db.doc('store/main').get().then(d=>{if(!d.exists){S=JSON.parse(JSON.stringify(def));db.doc('store/main').set(S);rb();rp()}});A('p')}).catch(()=>{$('#pe').textContent='Correo o contraseña incorrectos'});
const loginV=()=>admin?A('p'):FBon?fbV():M('<h2>Administrador</h2><input id="pw" type="password" placeholder="Contraseña"><button onclick="if($(\'#pw\').value===\'nuvo2026\'){admin=true;A(\'p\')}else $(\'#pe\').textContent=\'Contraseña incorrecta\'">Entrar</button> <button class="g" onclick="X()">Cancelar</button><p class="mut" id="pe">Acceso de prueba: nuvo2026</p>');
function A(t){const T=[['p','Artículos'],['b','Banners'],['c','Cupones'],['a','Ajustes']];let h='<h2>Panel de administrador</h2><div class="tabs">'+T.map(x=>'<button class="'+(x[0]==t?'':'g')+'" onclick="A(\''+x[0]+'\')">'+x[1]+'</button>').join('')+'<button class="g" onclick="X()">Cerrar</button>'+(FBon?'<button class="g" onclick="auth.signOut();admin=false;X()">Salir</button>':'')+'</div>';
if(t=='p')h+='<button onclick="pf(0)">Nuevo artículo</button> <button class="g" onclick="seedP()">Cargar catálogo inicial</button><p></p>'+S.products.map(p=>'<div class="box"><b>'+esc(p.n)+'</b> — '+money(pr(p))+' · Existencias: '+p.s+(p.v?'':' · <span class="mut">oculto</span>')+'<div class="row"><button class="g" onclick="pf('+p.id+')">Editar</button><button class="g" onclick="tg('+p.id+')">'+(p.v?'Bajar':'Subir')+'</button><button class="r" onclick="dl('+p.id+')">Eliminar</button></div></div>').join('');
if(t=='b')h+='<button onclick="S.banners.push({t:\'Nuevo banner\',s:\'\',img:\'\',c:\'#2a2622\'});sv();rb();A(\'b\')">Agregar banner</button><p></p>'+S.banners.map((b,i)=>'<div class="box">'+inp('Título','banners',i,'t')+inp('Subtítulo','banners',i,'s')+inp('URL de imagen (opcional)','banners',i,'img')+inp('Color de fondo','banners',i,'c')+'<button class="r" onclick="S.banners.splice('+i+',1);sv();rb();A(\'b\')">Eliminar</button></div>').join('');
if(t=='c')h+='<button onclick="S.coupons.push({k:\'NUEVO\',pct:5});sv();A(\'c\')">Agregar cupón</button><p></p>'+S.coupons.map((c,i)=>'<div class="box">'+inp('Código','coupons',i,'k')+inp('Descuento (%)','coupons',i,'pct')+'<button class="r" onclick="S.coupons.splice('+i+',1);sv();A(\'c\')">Eliminar</button></div>').join('');
if(t=='a')h+='<div class="box">'+inp('WhatsApp (con lada, solo números)','cfg',0,'wa')+inp('Liga de pago (opcional)','cfg',0,'pay')+inp('Texto de envío','cfg',0,'ship')+inp('Aviso de privacidad','cfg',0,'priv',1)+inp('Envíos y devoluciones','cfg',0,'ret',1)+'</div>';M(h)}
function inp(l,c,i,k,ta){const r=c=='cfg'?'S.cfg':'S.'+c+'['+i+']',h=' oninput="'+r+'.'+k+'=this.value'+(c=='coupons'&&k=='pct'?'*1':'')+';sv();rb();rp()"',v=esc(c=='cfg'?S.cfg[k]:S[c][i][k]);return '<label class="mut">'+l+'</label>'+(ta?'<textarea rows="3"'+h+'>'+v+'</textarea>':'<input value="'+v+'"'+h+'>')}
function seedP(){if(confirm('Esto reemplaza todos tus artículos actuales por el catálogo inicial. ¿Continuar?')){S.products=JSON.parse(JSON.stringify(def.products));sv();rp();A('p')}}
function pf(id){const p=S.products.find(x=>x.id==id)||{id:0,n:'',c:'',p:0,o:0,s:0,i:[],d:'',v:1},f=(k,l,v)=>'<label class="mut">'+l+'</label><input id="f'+k+'" value="'+esc(v)+'">';
M('<h2>'+(id?'Editar':'Nuevo')+' artículo</h2>'+f('n','Nombre',p.n)+f('c','Categoría',p.c)+f('p','Precio',p.p)+f('o','Precio de oferta (0 = sin oferta)',p.o)+f('s','Existencias',p.s)+'<label class="mut">Fotos (una URL por línea)</label><textarea id="fi" rows="3">'+esc(p.i.join('\n'))+'</textarea>'+f('d','Descripción',p.d)+'<label><input type="checkbox" id="fv" style="width:auto" '+(p.v?'checked':'')+'> Visible en la tienda</label><p><button onclick="ps('+id+')">Guardar</button> <button class="g" onclick="A(\'p\')">Cancelar</button></p>')}
function ps(id){const g=k=>$('#f'+k).value,o={id:id||Date.now(),n:g('n')||'Sin nombre',c:g('c'),p:+g('p')||0,o:+g('o')||0,s:+g('s')||0,i:g('i').split('\n').map(x=>x.trim()).filter(Boolean),d:g('d'),v:$('#fv').checked?1:0};
const i=S.products.findIndex(x=>x.id==id);i<0?S.products.push(o):S.products[i]=o;sv();rp();A('p')}
const tg=id=>{const p=S.products.find(x=>x.id==id);p.v=p.v?0:1;sv();rp();A('p')},dl=id=>{S.products=S.products.filter(x=>x.id!=id);sv();rp();A('p')};
let db,auth;if(FBon){firebase.initializeApp(FB);db=firebase.firestore();auth=firebase.auth();auth.onAuthStateChanged(u=>{admin=!!u});db.doc('store/main').onSnapshot(s=>{if(s.metadata.hasPendingWrites)return;if(s.exists){S=Object.assign({cfg:def.cfg,products:[],banners:[],coupons:[]},s.data());rb();rp()}},e=>console.error(e))}
$('#fl').src=$('.logo img').src;rb();rp();setInterval(()=>{if(S.banners.length>1&&!$('#m').innerHTML){bi++;rb()}},5000);
</script></body></html>
